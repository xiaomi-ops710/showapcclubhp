<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title | default: site.title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,1,0" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

<header class="appbar">
  <div class="appbar-title">昭和学院 パソコン部</div>
  <div style="display:flex; gap:4px;">
    <button class="icon-btn" id="themeToggle" aria-label="テーマ切り替え">
      <span class="msr" id="themeIcon">dark_mode</span>
    </button>
    <button class="icon-btn" id="menuBtn" aria-label="メニューを開く">
      <span class="msr">menu</span>
    </button>
  </div>
</header>

<div class="scrim" id="scrim"></div>
<nav class="drawer" id="drawer">
  <div class="drawer-title">メニュー</div>
  <a class="drawer-item {% if page.tab == 'home' %}active{% endif %}" href="{{ '/' | relative_url }}"><span class="msr">home</span>ホーム</a>
  <a class="drawer-item {% if page.tab == 'intro' %}active{% endif %}" href="{{ '/intro.html' | relative_url }}"><span class="msr">groups</span>紹介</a>
  <a class="drawer-item {% if page.tab == 'blog' %}active{% endif %}" href="{{ '/blog.html' | relative_url }}"><span class="msr">article</span>ブログ</a>
  <a class="drawer-item {% if page.tab == 'works' %}active{% endif %}" href="{{ '/works.html' | relative_url }}"><span class="msr">rocket_launch</span>制作物</a>
</nav>

<main>
{{ content }}
</main>

<nav class="tabbar">
  <a class="tab {% if page.tab == 'home' %}active{% endif %}" href="{{ '/' | relative_url }}">
    <span class="msr">home</span><span class="label">ホーム</span>
  </a>
  <a class="tab {% if page.tab == 'intro' %}active{% endif %}" href="{{ '/intro.html' | relative_url }}">
    <span class="msr">groups</span><span class="label">紹介</span>
  </a>
  <a class="tab {% if page.tab == 'blog' %}active{% endif %}" href="{{ '/blog.html' | relative_url }}">
    <span class="msr">article</span><span class="label">ブログ</span>
  </a>
  <a class="tab {% if page.tab == 'works' %}active{% endif %}" href="{{ '/works.html' | relative_url }}">
    <span class="msr">rocket_launch</span><span class="label">制作物</span>
  </a>
</nav>

{% if page.tab == 'home' %}
<script>window.PCCLUB_TAGLINES = {{ site.data.home.taglines | jsonify }};</script>
{% endif %}
<script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
