name: update.zipを自動展開

on:
  push:
    paths:
      - 'update.zip'

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: update.zipを展開する
        run: |
          unzip -o update.zip -d .
          rm -f update.zip

      - name: 変更をコミットする
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "update.zipを自動展開"
          git push
